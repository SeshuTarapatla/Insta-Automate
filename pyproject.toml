[project]
name = "insta-automate"
version = "0.1.0"
description = "Instagram automation flows."
readme = "README.md"
authors = [
    { name = "SeshuTarapatla", email = "seshu.tarapatla@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "async-typer>=0.1.10",
    "httpx>=0.28.1",
    "humanize>=4.15.0",
    "my-modules",
    "ollama>=0.6.1",
    "pillow>=12.2.0",
    "prefect-k3s",
    "python-dotenv>=1.2.2",
    "send2trash>=2.1.0",
    "sqlmodel>=0.0.38",
    "telethon>=1.42.0",
    "uiautomator2>=3.5.0",
    "wsl-bridge",
]

[project.scripts]
insta-automate = "insta_automate:ia"
ia = "insta_automate:ia"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
# Pinned to match wsl-bridge's own pin (D65) — wsl-bridge is a direct
# dependency here too (see below), and uv's resolver treats an unpinned git
# URL and a @rev-pinned one for the same package as genuinely conflicting
# sources, not "compatible until proven otherwise". Found live, CP 7.1
# checkpoint testing: `ia build` failed outright with exactly that conflict
# the moment this was first actually run since D65 pinned wsl-bridge's side.
my-modules = { git = "https://github.com/SeshuTarapatla/my-modules.git", rev = "94b308a" }
# Pinned to feat/control-center rather than left on main's default HEAD:
# that's where the matching my-modules pin above actually lives (D71's fix
# had to land in Prefect-K3S too, its own my-modules reference was
# unpinned and conflicted the same way). Same "point a feature branch at a
# feature branch for testing" pattern already used for GIT_BRANCH — revert
# to unpinned (main) once Prefect-K3S's branch merges.
prefect-k3s = { git = "https://github.com/SeshuTarapatla/Prefect-K3s.git", branch = "feat/control-center" }
# Same reason and same revert plan as prefect-k3s above — tg-auth's own
# my-modules reference was unpinned too, found only by tracing the actual
# conflict (it isn't in CLAUDE.md's repo table at all).
tg-auth = { git = "https://github.com/SeshuTarapatla/TG-Auth.git", branch = "feat/control-center" }
wsl-bridge = { git = "https://github.com/SeshuTarapatla/wsl-bridge.git" }

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pandas>=3.0.3",
    "tg-auth",
]
